name: Sync templates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy templates from the app repositories
        run: python3 scripts/sync.py
      - name: Community Applications checks (offline and online)
        run: python3 scripts/validate.py --online
      - name: Commit changes
        run: |
          git add -A templates plugins
          if git diff --cached --quiet; then
            echo "Templates already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync templates from app repositories"
          git push
